# The one Application applied by hand. Everything else is in argocd/apps/
# and arrives through this.
#
#   kubectl apply -f argocd/root.yaml
#
# App of apps: this Application's "manifests" are themselves Application
# objects. Argo CD applies them, and each one then deploys its own component.
# Adding a component = adding a file to argocd/apps/ and pushing. Removing one
# = deleting the file and pushing (prune is on).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  # Deleting `root` also deletes every Application it created -- and through
  # their own finalizers, everything they deployed.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Public repository: no credentials needed for Argo CD to read it.
    repoURL: https://github.com/nopega/VPN_DATA_PLATFORM.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true     # file removed from git -> Application removed from the cluster
      selfHeal: true  # someone edits an Application by hand -> put back to what git says
