# Trino 480 (chart 1.42.2) at https://trino.nopega.net -- over Tailscale only.
#
# Kept in argocd/next/ until bootstrap/trino.sh has created its Secrets and the
# old 'trino' record is gone from Cloudflare. Then: git mv to argocd/apps/.
#
# The chart is vendored in argocd/charts/trino with the original platform's
# edits: password authentication, per-user access rules, resource groups,
# the data_platform iceberg catalog, heap sizes. valuesObject below changes
# only what is different here.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trino
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nopega/VPN_DATA_PLATFORM.git
    targetRevision: main
    path: argocd/charts/trino
    helm:
      valuesObject:
        server:
          # One worker, fixed. The original ran 2-5; each worker requests
          # 4 GiB and the cluster has one 16 GiB node. Raise both once the
          # node group can grow (cluster autoscaler / Karpenter, BACKLOG).
          workers: 1
          autoscaling:
            enabled: false

        # Polaris now lives in namespace "polaris" (was "data-platform").
        # Same catalog name, warehouse and settings as the original otherwise.
        catalogs:
          data_platform: |
            connector.name=iceberg
            iceberg.catalog.type=rest
            iceberg.rest-catalog.uri=http://polaris.polaris.svc.cluster.local:8181/api/catalog
            iceberg.rest-catalog.warehouse=data_platform
            iceberg.rest-catalog.security=OAUTH2
            iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_OAUTH2_CREDENTIAL}
            iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
            iceberg.rest-catalog.oauth2.server-uri=http://polaris.polaris.svc.cluster.local:8181/api/catalog/v1/oauth/tokens
            iceberg.rest-catalog.vended-credentials-enabled=true
            iceberg.rest-catalog.nested-namespace-enabled=true
            iceberg.file-format=PARQUET
            fs.native-s3.enabled=true
            s3.region=ap-southeast-1
          tpch: |
            connector.name=tpch
            tpch.splits-per-node=4
          tpcds: |
            connector.name=tpcds
            tpcds.splits-per-node=4

        # Trino needs no AWS identity: Polaris vends short-lived S3
        # credentials per table. Its own service account, nothing bound.
        serviceAccount:
          create: true
          name: trino

        # Needs the Prometheus Operator's CRDs, which are not installed yet.
        # Turn back on when monitoring arrives.
        serviceMonitor:
          enabled: false

        ingress:
          enabled: true
          className: alb
          annotations:
            alb.ingress.kubernetes.io/scheme: internal
            alb.ingress.kubernetes.io/target-type: ip
            alb.ingress.kubernetes.io/group.name: vpn-data-platform-internal
            alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
            alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
            alb.ingress.kubernetes.io/inbound-cidrs: 10.42.0.0/16
            # Answers 200 without authentication -- "/" would demand a login.
            alb.ingress.kubernetes.io/healthcheck-path: /v1/info
            # NOT set here: load-balancer-attributes (e.g. a 600 s idle timeout
            # for wide scans). It must be identical on every Ingress in the
            # group or the controller rejects the newest one -- add it to all of
            # them at once (BACKLOG).
          hosts:
            - host: trino.nopega.net
              paths:
                - path: /
                  pathType: Prefix
          tls:
            # The controller finds the *.nopega.net ACM certificate from these
            # hosts; the secret name is required by the chart and ignored by
            # the ALB.
            - secretName: trino-tls-unused
              hosts:
                - trino.nopega.net

  destination:
    server: https://kubernetes.default.svc
    namespace: trino
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
